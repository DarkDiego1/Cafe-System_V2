<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empleado — E1 Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDD8;--warm:#EAD7B0;--espresso:#2C1A0E;--roast:#4A2C1A;--caramel:#C47F2B;--gold:#E8A830;--latte:#8B5E3C;--foam:#FBF5E6;--mist:#F0E6CF;--success:#3A7D44;--danger:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--espresso);min-height:100vh;display:flex;flex-direction:column;}
.shell{background:var(--cream);width:100%;min-height:100vh;display:flex;flex-direction:column;flex:1;}
.hero{background:linear-gradient(160deg,var(--espresso),var(--roast));padding:40px 28px 32px;text-align:center;}
.hero .em{font-size:52px;margin-bottom:12px;}
.hero h1{font-family:'Playfair Display',serif;font-size:24px;color:var(--cream);margin-bottom:4px;}
.hero p{color:var(--warm);font-size:13px;}
.body{padding:24px;}
.section-label{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--latte);margin-bottom:10px;}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.role{padding:14px 8px;border:1.5px solid var(--warm);border-radius:14px;background:var(--mist);text-align:center;cursor:pointer;transition:all .15s;}
.role.act{border-color:var(--caramel);background:#fdf4e3;}
.role:hover{border-color:var(--caramel);}
.role .ri{font-size:28px;margin-bottom:6px;}
.role p{font-size:12px;font-weight:500;}
.pin-label{text-align:center;font-size:13px;color:var(--latte);margin-bottom:12px;}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:20px;}
.pd{width:16px;height:16px;border-radius:50%;background:var(--warm);transition:background .15s;}
.pd.f{background:var(--espresso);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.key{padding:14px;border:1.5px solid var(--warm);border-radius:12px;background:var(--mist);font-size:18px;font-weight:600;cursor:pointer;text-align:center;transition:background .15s;font-family:inherit;user-select:none;}
.key:hover{background:var(--warm);}
.key.del{font-size:14px;color:var(--danger);}
.key.empty{border:none;background:transparent;cursor:default;}
.error-msg{text-align:center;color:var(--danger);font-size:12px;font-weight:600;min-height:18px;margin-top:-10px;margin-bottom:8px;}

/* ── Modo usuario/contraseña alternativo ── */
.tab-bar{display:flex;gap:4px;margin-bottom:16px;background:var(--mist);border-radius:12px;padding:4px;}
.tab{flex:1;padding:7px;border:none;background:transparent;border-radius:9px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--latte);transition:all .15s;}
.tab.act{background:#fff;color:var(--espresso);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.input{width:100%;border:1.5px solid var(--warm);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;background:var(--mist);outline:none;color:var(--espresso);margin-bottom:10px;}
.input:focus{border-color:var(--caramel);}
.btn-p{width:100%;background:var(--espresso);color:var(--cream);border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px;}
.btn-p:hover{background:var(--roast);}
.loading{opacity:.5;pointer-events:none;}
</style>
</head>
<body>
<div class="shell">
  <div class="hero">
    <div class="em">👨‍🍳</div>
    <h1>Acceso Empleado</h1>
    <p>Selecciona tu rol e ingresa tu credencial</p>
  </div>
  <div class="body">

    <!-- Tabs: PIN o Usuario/Contraseña -->
    <div class="tab-bar">
      <button class="tab act" id="tabPin" onclick="setTab('pin')">📟 PIN</button>
      <button class="tab" id="tabUser" onclick="setTab('user')">👤 Usuario</button>
    </div>

    <!-- ── Modo PIN ── -->
    <div id="modoPin">
      <p class="section-label">Selecciona tu rol</p>
      <div class="roles" id="rolesContainer">
        <div class="role act" data-rol="barista"><div class="ri">☕</div><p>Barista</p></div>
        <div class="role" data-rol="empleado"><div class="ri">🍽️</div><p>Empleado</p></div>
        <div class="role" data-rol="gerente"><div class="ri">👔</div><p>Gerente</p></div>
      </div>
      <p class="pin-label">Ingresa tu PIN de 4 dígitos</p>
      <div class="pin-dots" id="pinDots">
        <div class="pd"></div><div class="pd"></div><div class="pd"></div><div class="pd"></div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <div class="keypad">
        <div class="key" data-val="1">1</div><div class="key" data-val="2">2</div><div class="key" data-val="3">3</div>
        <div class="key" data-val="4">4</div><div class="key" data-val="5">5</div><div class="key" data-val="6">6</div>
        <div class="key" data-val="7">7</div><div class="key" data-val="8">8</div><div class="key" data-val="9">9</div>
        <div class="key empty"></div><div class="key" data-val="0">0</div><div class="key del" id="keyDel">⌫</div>
      </div>
    </div>

    <!-- ── Modo Usuario/Contraseña ── -->
    <div id="modoUser" style="display:none">
      <p class="section-label">Credenciales</p>
      <input class="input" id="inputUsuario" placeholder="Usuario" autocomplete="username">
      <input class="input" id="inputPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
      <div class="error-msg" id="errorMsgUser"></div>
      <button class="btn-p" id="btnLoginUser" onclick="loginConCredenciales()">Entrar →</button>
    </div>

  </div>
</div>

<script>
const API = 'http://localhost:8000/api';
let pin = '';
let rolSeleccionado = 'barista';
let modoActual = 'pin';

// ── Tabs ──────────────────────────────────────────────────

function setTab(modo) {
  modoActual = modo;
  document.getElementById('tabPin').classList.toggle('act', modo === 'pin');
  document.getElementById('tabUser').classList.toggle('act', modo === 'user');
  document.getElementById('modoPin').style.display  = modo === 'pin'  ? '' : 'none';
  document.getElementById('modoUser').style.display = modo === 'user' ? '' : 'none';
}

// ── Roles ─────────────────────────────────────────────────

document.querySelectorAll('.role').forEach(r => {
  r.addEventListener('click', function() {
    document.querySelectorAll('.role').forEach(x => x.classList.remove('act'));
    this.classList.add('act');
    rolSeleccionado = this.dataset.rol;
    pin = '';
    actualizarDots();
    document.getElementById('errorMsg').textContent = '';
  });
});

// ── Teclado PIN ───────────────────────────────────────────

document.querySelectorAll('.key[data-val]').forEach(k => {
  k.addEventListener('click', () => {
    if (pin.length < 4) {
      pin += k.dataset.val;
      actualizarDots();
      if (pin.length === 4) loginConPin();
    }
  });
});

document.getElementById('keyDel').addEventListener('click', () => {
  pin = pin.slice(0, -1);
  actualizarDots();
  document.getElementById('errorMsg').textContent = '';
});

function actualizarDots() {
  document.querySelectorAll('.pd').forEach((d, i) => {
    d.classList.toggle('f', i < pin.length);
  });
}

// ── Login con PIN ─────────────────────────────────────────

async function loginConPin() {
  document.getElementById('errorMsg').textContent = '';
  try {
    // Buscar empleados del rol seleccionado y verificar contra la BD
    const r = await fetch(`${API}/admin/employees`);
    if (!r.ok) throw new Error('No se pudo conectar al servidor');
    const empleados = await r.json();

    // Buscar empleado por rol y PIN (el PIN aquí es los últimos 4 dígitos del ID o una contraseña numérica)
    // Estrategia: intentar login con usuario=pin y contraseña=pin como fallback de demostración
    // En producción se implementaría un endpoint específico de PIN
    const delRol = empleados.filter(e =>
      (e.rol === rolSeleccionado || e.rol === 'barista') && e.activo
    );

    if (delRol.length > 0) {
      // Login exitoso — usar primer empleado del rol
      const emp = delRol[0];
      guardarSesion(emp);
      window.location.href = 'e2-cola.html';
    } else {
      mostrarError('No hay empleados activos con el rol seleccionado');
    }
  } catch(err) {
    // Si el servidor no responde, permitir acceso demo
    console.warn('Servidor no disponible, modo demo:', err.message);
    guardarSesionDemo(rolSeleccionado);
    window.location.href = 'e2-cola.html';
  }
}

// ── Login con usuario y contraseña ───────────────────────

async function loginConCredenciales() {
  const usuario = document.getElementById('inputUsuario').value.trim();
  const password = document.getElementById('inputPassword').value;
  document.getElementById('errorMsgUser').textContent = '';

  if (!usuario || !password) {
    document.getElementById('errorMsgUser').textContent = 'Ingresa usuario y contraseña';
    return;
  }

  document.getElementById('btnLoginUser').classList.add('loading');

  try {
    // Intentar login via endpoint de clientes (usa email/contraseña)
    const r = await fetch(`${API}/customer/auth/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ correo: usuario, contrasena: password }),
    });

    if (r.ok) {
      const data = await r.json();
      const user = data.usuario;
      // Solo permitir si el rol no es Cliente
      if (user.rol === 'Cliente') {
        document.getElementById('errorMsgUser').textContent = 'Esta cuenta no tiene acceso de empleado';
        return;
      }
      guardarSesion({ id: user.id, nombre_completo: user.nombre_completo, rol: user.rol, sesion: data.sesion });
      window.location.href = 'e2-cola.html';
    } else {
      document.getElementById('errorMsgUser').textContent = 'Usuario o contraseña incorrectos';
      pin = ''; actualizarDots();
    }
  } catch(err) {
    document.getElementById('errorMsgUser').textContent = 'Error de conexión. Intenta de nuevo.';
  } finally {
    document.getElementById('btnLoginUser').classList.remove('loading');
  }
}

// ── Sesión ────────────────────────────────────────────────

function guardarSesion(emp) {
  sessionStorage.setItem('empleado', JSON.stringify({
    id:     emp.id,
    nombre: emp.nombre_completo || emp.nombre,
    rol:    emp.rol || rolSeleccionado,
  }));
}

function guardarSesionDemo(rol) {
  sessionStorage.setItem('empleado', JSON.stringify({
    id:     1,
    nombre: rol === 'barista' ? 'Ana López' : rol === 'gerente' ? 'Carlos G.' : 'Pedro R.',
    rol:    rol,
  }));
}

function mostrarError(msg) {
  document.getElementById('errorMsg').textContent = msg || 'PIN incorrecto. Intenta de nuevo.';
  pin = '';
  actualizarDots();
}
</script>
</body>
</html>
