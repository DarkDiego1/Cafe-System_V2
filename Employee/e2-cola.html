<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empleado — E2 Cola de Órdenes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDD8;--warm:#EAD7B0;--espresso:#2C1A0E;--roast:#4A2C1A;--caramel:#C47F2B;--gold:#E8A830;--latte:#8B5E3C;--foam:#FBF5E6;--mist:#F0E6CF;--success:#3A7D44;--danger:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--espresso);min-height:100vh;display:flex;flex-direction:column;}
.shell{background:var(--cream);width:100%;min-height:100vh;display:flex;flex-direction:column;flex:1;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;background:var(--cream);border-bottom:1px solid var(--warm);}
.logo{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--espresso);}
.logo span{color:var(--caramel);}
.btn-o{background:none;border:1.5px solid var(--warm);color:var(--espresso);border-radius:10px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-o:hover{border-color:var(--caramel);}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px;flex:1;}
.col-h{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:7px 10px;border-radius:10px;margin-bottom:8px;text-align:center;}
.col-pend .col-h{background:rgba(196,127,43,.12);color:var(--caramel);}
.col-prep .col-h{background:rgba(196,100,43,.12);color:#c4642b;}
.col-list .col-h{background:rgba(58,125,68,.12);color:var(--success);}
.col-ent .col-h{background:rgba(44,26,14,.08);color:var(--latte);}
.kcard{background:var(--foam);border:1px solid var(--warm);border-radius:13px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border-left:3px solid var(--warm);transition:transform .12s;}
.kcard:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(44,26,14,.1);}
.kcard.pend{border-left-color:var(--caramel);}
.kcard.prep{border-left-color:#c4642b;}
.kcard.list{border-left-color:var(--success);}
.kcard.ent{border-left-color:var(--warm);opacity:.55;}
.kcard .cn{font-size:13px;font-weight:600;margin-bottom:2px;}
.kcard .ci{font-size:11px;color:var(--latte);}
.kcard .ct{font-size:12px;color:var(--roast);margin-top:5px;line-height:1.4;}
.kcard .timer{display:inline-block;margin-top:6px;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;}
.timer.ok{background:#e8f5eb;color:var(--success);}
.timer.warn{background:#fdf4e3;color:var(--caramel);}
.timer.over{background:#fce8e6;color:var(--danger);}
.empty-col{text-align:center;color:var(--latte);font-size:12px;padding:20px 8px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#6bffa0;display:inline-block;animation:pulse 1.5s infinite;margin-right:4px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <span class="logo">Nuevos <span>Horizontes</span></span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="live-dot"></span>
      <span style="font-size:12px;color:var(--latte)" id="infoUsuario">Cargando…</span>
      <button class="btn-o" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>

  <div style="padding:8px 16px 4px;display:flex;align-items:center;justify-content:space-between">
    <p style="font-family:'Playfair Display',serif;font-size:18px;font-weight:600">Cola de Órdenes</p>
    <span style="font-size:11px;color:var(--latte)" id="ultimaActualizacion"></span>
  </div>

  <div class="kanban" id="kanbanBoard">
    <div class="col col-pend"><div class="col-h">⏳ Pendiente <span id="cntPend">(0)</span></div><div id="colPend"><div class="empty-col">Sin órdenes</div></div></div>
    <div class="col col-prep"><div class="col-h">🔥 Preparando <span id="cntPrep">(0)</span></div><div id="colPrep"><div class="empty-col">Sin órdenes</div></div></div>
    <div class="col col-list"><div class="col-h">✅ Listas <span id="cntList">(0)</span></div><div id="colList"><div class="empty-col">Sin órdenes</div></div></div>
    <div class="col col-ent"><div class="col-h">📦 Entregadas <span id="cntEnt">(0)</span></div><div id="colEnt"><div class="empty-col">Sin órdenes</div></div></div>
  </div>
</div>

<script>
const API = 'http://localhost:8000/api';

// ── Sesión ────────────────────────────────────────────────
const sesionStr = sessionStorage.getItem('empleado');
const sesion = sesionStr ? JSON.parse(sesionStr) : { nombre: 'Empleado', rol: 'barista', id: null };

function cerrarSesion() {
  sessionStorage.removeItem('empleado');
  window.location.href = 'e1-login.html';
}

function actualizarInfoUsuario() {
  const d = new Date();
  const h = d.getHours() % 12 || 12;
  const m = d.getMinutes().toString().padStart(2,'0');
  const ampm = d.getHours() >= 12 ? 'pm' : 'am';
  document.getElementById('infoUsuario').textContent =
    `${sesion.nombre} · ${sesion.rol} · 🕐 ${h}:${m} ${ampm}`;
}
actualizarInfoUsuario();
setInterval(actualizarInfoUsuario, 60000);

// ── Helpers ───────────────────────────────────────────────

function tiempoTranscurrido(fechaISO) {
  const mins = Math.floor((Date.now() - new Date(fechaISO)) / 60000);
  const secs = Math.floor(((Date.now() - new Date(fechaISO)) % 60000) / 1000);
  return `${mins}:${secs.toString().padStart(2,'0')}`;
}

function timerClass(fechaISO) {
  const mins = Math.floor((Date.now() - new Date(fechaISO)) / 60000);
  if (mins >= 10) return 'over';
  if (mins >= 6)  return 'warn';
  return 'ok';
}

function resumenItems(items) {
  if (!items || !items.length) return '—';
  return items.map(i => {
    const emoji = '☕';
    return `${emoji} ${i.nombre_bebida || i.bebida || '?'} ${i.tamano ? '· '+i.tamano : ''} ${i.cantidad > 1 ? '×'+i.cantidad : ''}`.trim();
  }).join('<br>');
}

// ── Mapeo de estados BD → columna kanban ──────────────────
// BD: Pendiente | Pagado | EnPreparacion | ListaParaRecoger | Entregada | Cancelada
const estadoACol = {
  pendiente:      'pend',
  pagado:         'pend',
  Pendiente:      'pend',
  Pagado:         'pend',
  en_preparacion: 'prep',
  EnPreparacion:  'prep',
  lista:          'list',
  ListaParaRecoger:'list',
  entregada:      'ent',
  Entregada:      'ent',
};

// ── Cargar órdenes del backend ────────────────────────────

async function cargarOrdenes() {
  try {
    const r = await fetch(`${API}/production/orders`);
    if (!r.ok) throw new Error(r.statusText);
    const ordenes = await r.json();

    const cols = { pend: [], prep: [], list: [], ent: [] };
    ordenes.forEach(o => {
      const col = estadoACol[o.estado] || 'pend';
      cols[col].push(o);
    });

    renderColumna('colPend', cols.pend, 'pend');
    renderColumna('colPrep', cols.prep, 'prep');
    renderColumna('colList', cols.list, 'list');
    renderColumna('colEnt',  cols.ent,  'ent');

    document.getElementById('cntPend').textContent = `(${cols.pend.length})`;
    document.getElementById('cntPrep').textContent = `(${cols.prep.length})`;
    document.getElementById('cntList').textContent = `(${cols.list.length})`;
    document.getElementById('cntEnt').textContent  = `(${cols.ent.length})`;

    const ahora = new Date();
    document.getElementById('ultimaActualizacion').textContent =
      `Actualizado ${ahora.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}`;
  } catch(err) {
    console.warn('Error cargando órdenes:', err.message);
    document.getElementById('ultimaActualizacion').textContent = '⚠ Sin conexión';
  }
}

function renderColumna(colId, ordenes, tipo) {
  const col = document.getElementById(colId);
  if (!ordenes.length) {
    col.innerHTML = '<div class="empty-col">Sin órdenes</div>';
    return;
  }
  col.innerHTML = ordenes.map(o => {
    const tiempo = o.fecha_creacion
      ? `<div class="timer ${timerClass(o.fecha_creacion)}">${tiempoTranscurrido(o.fecha_creacion)}</div>`
      : '';
    const notas = o.notas_generales
      ? `<div style="font-size:10px;color:var(--caramel);margin-top:4px">⚠ ${o.notas_generales}</div>`
      : '';
    const items = resumenItems(o.items || []);
    return `<div class="kcard ${tipo}" onclick="window.location.href='e3-detalle.html?orden=${o.id}'">
      <div class="cn">Orden #${o.codigo_orden || o.id?.slice(0,8)}</div>
      <div class="ci">${o.nombre_cliente || 'Cliente'}</div>
      <div class="ct">${items}</div>
      ${notas}
      ${tipo !== 'ent' ? tiempo : '<div style="font-size:10px;color:var(--success)">Entregada ✓</div>'}
    </div>`;
  }).join('');
}

// ── Inicializar y polling ────────────────────────────────

cargarOrdenes();
setInterval(cargarOrdenes, 10000); // actualizar cada 10 segundos
</script>
</body>
</html>
