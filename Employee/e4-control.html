<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empleado — E4 Control de Estado</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDD8;--warm:#EAD7B0;--espresso:#2C1A0E;--roast:#4A2C1A;--caramel:#C47F2B;--gold:#E8A830;--latte:#8B5E3C;--foam:#FBF5E6;--mist:#F0E6CF;--success:#3A7D44;--danger:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--espresso);min-height:100vh;display:flex;flex-direction:column;}
.shell{background:var(--cream);width:100%;min-height:100vh;display:flex;flex-direction:column;flex:1;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;background:var(--cream);border-bottom:1px solid var(--warm);}
.logo{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--espresso);}
.logo span{color:var(--caramel);}
.btn-o{background:none;border:1.5px solid var(--warm);color:var(--espresso);border-radius:10px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;text-decoration:none;display:inline-block;}
.btn-o:hover{border-color:var(--caramel);}
.toast-bar{background:var(--espresso);color:var(--cream);border-radius:12px;padding:11px 16px;margin:0 16px 12px;display:none;align-items:center;justify-content:space-between;font-size:13px;}
.toast-bar .undo{background:var(--gold);color:var(--espresso);border:none;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 20px;}
.oc{border-radius:16px;overflow:hidden;border:1px solid var(--warm);}
.oc .oh{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;}
.oc .on{font-size:13px;font-weight:700;}
.oc .ot{font-size:11px;opacity:.85;}
.oc .od{padding:10px 14px;background:var(--foam);}
.oc .oi{font-size:12px;color:var(--latte);margin-bottom:8px;line-height:1.4;}
.oc .ob-row{display:flex;gap:6px;}
.oc .ob{flex:1;padding:8px;border:none;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s;}
.oc .ob:hover{filter:brightness(.9);}
.oc.pend .oh{background:var(--caramel);color:#fff;}
.oc.prep .oh{background:#c4642b;color:#fff;}
.oc.list .oh{background:var(--success);color:#fff;}
.empty-state{text-align:center;color:var(--latte);font-size:13px;padding:40px 20px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#6bffa0;display:inline-block;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <span class="logo">Nuevos <span>Horizontes</span></span>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="live-dot"></span>
      <span style="font-size:11px;color:var(--latte)" id="ultimaAct"></span>
      <a class="btn-o" href="e2-cola.html">← Cola</a>
    </div>
  </div>

  <div style="padding:8px 16px 8px;display:flex;align-items:center;justify-content:space-between">
    <p style="font-family:'Playfair Display',serif;font-size:18px;font-weight:600">Control Rápido</p>
    <button class="btn-o" onclick="cargarOrdenes()" style="font-size:11px">↻ Actualizar</button>
  </div>

  <div class="toast-bar" id="toastBar">
    <span id="toastMsg">—</span>
    <button class="undo" id="btnDeshacer">Deshacer (5s)</button>
  </div>

  <div class="grid" id="gridOrdenes">
    <div class="empty-state" style="grid-column:1/-1">Cargando órdenes…</div>
  </div>
</div>

<script>
const API = 'http://localhost:8000/api';
let ultimoCambio = null;
let timerDeshacer = null;
const sesion = JSON.parse(sessionStorage.getItem('empleado') || '{}');

// ── Helpers ───────────────────────────────────────────────

function tiempoTranscurrido(fechaISO) {
  const mins = Math.floor((Date.now() - new Date(fechaISO)) / 60000);
  const secs = Math.floor(((Date.now() - new Date(fechaISO)) % 60000) / 1000);
  const str = `${mins}:${secs.toString().padStart(2,'0')}`;
  if (mins >= 10) return `${str} 🔴`;
  if (mins >= 6)  return `${str} ⚠️`;
  return str;
}

function resumenItems(items) {
  if (!items || !items.length) return '—';
  return items.slice(0,2).map(i =>
    `${i.nombre_bebida || '?'} ${i.tamano ? '·'+i.tamano : ''} ${i.cantidad > 1 ? '×'+i.cantidad : ''}`.trim()
  ).join(' · ') + (items.length > 2 ? ` +${items.length-2}` : '');
}

// ── Cargar órdenes activas ────────────────────────────────

async function cargarOrdenes() {
  try {
    const r = await fetch(`${API}/production/orders`);
    if (!r.ok) throw new Error(r.statusText);
    const ordenes = await r.json();

    // Solo mostrar órdenes activas (no entregadas ni canceladas)
    const activas = ordenes.filter(o => {
      const e = o.estado || '';
      return !['Entregada','Cancelada','Rechazada'].includes(e);
    });

    document.getElementById('ultimaAct').textContent =
      new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});

    if (!activas.length) {
      document.getElementById('gridOrdenes').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1">✓ Sin órdenes activas en este momento</div>';
      return;
    }

    document.getElementById('gridOrdenes').innerHTML = activas.map(o => {
      const esPend = ['Pendiente','Pagado'].includes(o.estado);
      const esPrep = ['EnPreparacion'].includes(o.estado);
      const esLista = ['ListaParaRecoger'].includes(o.estado);
      const tipo = esPend ? 'pend' : esPrep ? 'prep' : esLista ? 'list' : 'pend';
      const codigo = o.codigo_orden || o.id?.slice(0,8);
      const tiempo = o.fecha_creacion ? tiempoTranscurrido(o.fecha_creacion) : '—';

      let botones = '';
      if (esPend) {
        botones = `
          <div class="ob" style="background:#e8f5eb;color:var(--success)" onclick="accion('${o.id}','start','${codigo}')">▶ Iniciar</div>
          <div class="ob" style="background:#fce8e6;color:var(--danger)" onclick="window.location.href='e5-reporte.html?orden=${o.id}'">⚠️</div>`;
      } else if (esPrep) {
        botones = `
          <div class="ob" style="background:#e8f5eb;color:var(--success)" onclick="accion('${o.id}','ready','${codigo}')">✅ Lista</div>
          <div class="ob" style="background:#fce8e6;color:var(--danger)" onclick="window.location.href='e5-reporte.html?orden=${o.id}'">⚠️</div>`;
      } else if (esLista) {
        botones = `
          <div class="ob" style="background:#fdf4e3;color:var(--caramel)" onclick="notificar('${o.id}','${codigo}')">📢 Llamar</div>
          <div class="ob" style="background:var(--mist);color:var(--latte)" onclick="accion('${o.id}','deliver','${codigo}')">✓ Entregada</div>`;
      }

      return `<div class="oc ${tipo}" data-orden="${o.id}">
        <div class="oh" onclick="window.location.href='e3-detalle.html?orden=${o.id}'" style="cursor:pointer">
          <span class="on">#${codigo}</span>
          <span class="ot">${tiempo}</span>
        </div>
        <div class="od">
          <div class="oi">${resumenItems(o.items || [])}</div>
          <div class="ob-row">${botones}</div>
        </div>
      </div>`;
    }).join('');

  } catch(err) {
    document.getElementById('gridOrdenes').innerHTML =
      `<div class="empty-state" style="grid-column:1/-1">⚠ Error: ${err.message}</div>`;
  }
}

// ── Acciones ──────────────────────────────────────────────

async function accion(ordenId, tipo, codigo) {
  const endpoints = {
    start:   `/production/orders/${ordenId}/start`,
    ready:   `/production/orders/${ordenId}/ready`,
    deliver: `/production/orders/${ordenId}/deliver`,
  };

  try {
    const body = tipo === 'start'
      ? JSON.stringify({ empleado_id: sesion.id || null })
      : '{}';

    const r = await fetch(`${API}${endpoints[tipo]}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body,
    });

    if (!r.ok) {
      const e = await r.json();
      alert('Error: ' + (e.detail || r.statusText));
      return;
    }

    const data = await r.json();

    // Acciones post-cambio
    if (tipo === 'ready') {
      await fetch(`${API}/production/orders/${ordenId}/notify`, { method: 'POST' });
      await fetch(`${API}/production/orders/${ordenId}/prep-time`, { method: 'POST' });
    }

    // Guardar para deshacer (solo aplica en start y ready)
    if (tipo !== 'deliver') {
      ultimoCambio = { ordenId, tipo, codigo, estadoAnterior: data.estado };
      mostrarToast(`↩ Orden #${codigo} → ${data.estado || tipo}`);
    }

    cargarOrdenes();

  } catch(err) {
    alert('Error de conexión: ' + err.message);
  }
}

async function notificar(ordenId, codigo) {
  try {
    await fetch(`${API}/production/orders/${ordenId}/notify`, { method: 'POST' });
    mostrarToast(`📢 Cliente de orden #${codigo} notificado`);
  } catch(err) {
    alert('Error al notificar: ' + err.message);
  }
}

// ── Deshacer ──────────────────────────────────────────────

async function deshacerCambio() {
  if (!ultimoCambio) return;

  const endpoints = {
    start: `/production/orders/${ultimoCambio.ordenId}/undo-ready`,   // no existe para start, usamos el estado anterior
    ready: `/production/orders/${ultimoCambio.ordenId}/undo-ready`,
  };

  try {
    if (ultimoCambio.tipo === 'ready') {
      await fetch(`${API}${endpoints.ready}`, { method: 'PATCH', headers:{'Content-Type':'application/json'}, body:'{}' });
    }
    // Para 'start' no hay endpoint de deshacer — solo refrescamos
    ultimoCambio = null;
    ocultarToast();
    cargarOrdenes();
  } catch(err) {
    alert('Error al deshacer: ' + err.message);
  }
}

// ── Toast ─────────────────────────────────────────────────

function mostrarToast(msg) {
  clearTimeout(timerDeshacer);
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastBar').style.display = 'flex';
  let secs = 5;
  document.getElementById('btnDeshacer').textContent = `Deshacer (${secs}s)`;
  timerDeshacer = setInterval(() => {
    secs--;
    document.getElementById('btnDeshacer').textContent = `Deshacer (${secs}s)`;
    if (secs <= 0) { clearInterval(timerDeshacer); ocultarToast(); ultimoCambio = null; }
  }, 1000);
}

function ocultarToast() {
  document.getElementById('toastBar').style.display = 'none';
}

document.getElementById('btnDeshacer').addEventListener('click', deshacerCambio);

// ── Init y polling ────────────────────────────────────────

cargarOrdenes();
setInterval(cargarOrdenes, 10000);
</script>
</body>
</html>
