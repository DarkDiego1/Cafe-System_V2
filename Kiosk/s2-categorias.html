<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosco — S2 Categorías</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDD8;--warm:#EAD7B0;--espresso:#2C1A0E;--roast:#4A2C1A;--caramel:#C47F2B;--gold:#E8A830;--latte:#8B5E3C;--foam:#FBF5E6;--mist:#F0E6CF;--success:#3A7D44;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--espresso);min-height:100vh;display:flex;flex-direction:column;}
.shell{width:100%;background:var(--cream);min-height:100vh;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;background:var(--cream);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--warm);}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--espresso);}
.logo span{color:var(--caramel);}
.back-btn{background:none;border:none;cursor:pointer;font-size:20px;color:var(--latte);padding:4px 8px;border-radius:8px;}
.cart-pill{background:var(--espresso);color:var(--cream);border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;}
.cart-pill .badge{background:var(--gold);color:var(--espresso);border-radius:10px;padding:1px 7px;font-size:12px;font-weight:600;}
.section-label{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--latte);padding:0 20px;margin-bottom:10px;}
.greeting-bar{padding:14px 20px 0;}
.greeting-bar h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;}
.greeting-bar p{font-size:13px;color:var(--latte);margin-top:2px;}
.search-bar{margin:12px 20px;display:flex;align-items:center;background:var(--mist);border:1.5px solid var(--warm);border-radius:14px;padding:10px 14px;gap:8px;}
.search-bar input{background:none;border:none;outline:none;font-size:14px;color:var(--espresso);flex:1;font-family:'DM Sans',sans-serif;}
.search-bar input::placeholder{color:var(--latte);opacity:.7;}
/* Populares */
.popular-row{padding:0 20px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;}
.pop-chip{background:var(--espresso);color:var(--cream);border-radius:20px;padding:7px 12px;font-size:12px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;transition:background .15s;}
.pop-chip:hover{background:var(--roast);}
.pop-chip.gold{background:var(--gold);color:var(--espresso);}
.pop-chip img{width:20px;height:20px;border-radius:50%;object-fit:cover;}
/* Categorías */
.cats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 80px;}
.cat-card{border-radius:18px;overflow:hidden;cursor:pointer;position:relative;height:110px;transition:transform .15s;}
.cat-card:hover{transform:scale(1.02);}
.cat-bg{position:absolute;inset:0;background:linear-gradient(135deg,#5c3820,#2c1a0e);display:flex;align-items:center;justify-content:center;font-size:44px;}
.cat-bg img{width:100%;height:100%;object-fit:cover;}
.cat-bg .fallback-emoji{position:absolute;font-size:44px;}
.cat-overlay{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(transparent,rgba(44,26,14,.75));}
.cat-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:#fff;}
.cat-count{font-size:11px;color:rgba(255,255,255,.7);}
/* Search results */
.search-results{display:none;padding:0 20px 20px;flex-direction:column;gap:8px;}
.sr-item{background:var(--foam);border:1px solid var(--warm);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.sr-img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--mist);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;}
.sr-img img{width:100%;height:100%;object-fit:cover;}
.sr-name{font-size:14px;font-weight:500;}
.sr-price{font-size:13px;color:var(--caramel);font-weight:600;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='s1-bienvenida.html'">←</button>
    <span class="logo">Nuevos <span>Horizontes</span></span>
    <button class="cart-pill" id="btnCarrito" onclick="window.location.href='s5-carrito.html'">
      🛒 <span class="badge" id="cartCount">0</span>
    </button>
  </div>

  <div class="greeting-bar">
    <h2>¿Qué vas a ordenar hoy?</h2>
    <p id="saludoContexto">Cargando menú…</p>
  </div>

  <div class="search-bar">
    <span>🔍</span>
    <input type="text" id="busqueda" placeholder="Busca tu bebida favorita...">
  </div>

  <div class="section-label" id="labelPopulares" style="display:none">Populares ahora</div>
  <div class="popular-row" id="popularRow"></div>

  <div class="section-label">Categorías</div>
  <div class="cats-grid" id="catGrid">
    <!-- esqueleto de carga -->
    <div class="cat-card" style="background:var(--mist)"></div>
    <div class="cat-card" style="background:var(--mist)"></div>
    <div class="cat-card" style="background:var(--mist)"></div>
    <div class="cat-card" style="background:var(--mist)"></div>
  </div>

  <!-- Resultados de búsqueda -->
  <div class="search-results" id="searchResults"></div>
</div>

<script>
const API = 'http://localhost:8000/api';

// Paleta de gradientes para categorías sin imagen
const GRADIENTES = [
  'linear-gradient(135deg,#5c3820,#8b5e3c)',
  'linear-gradient(135deg,#2d5016,#4a8022)',
  'linear-gradient(135deg,#1a3a5c,#2e6b9e)',
  'linear-gradient(135deg,#7a2d00,#c45a00)',
  'linear-gradient(135deg,#6b1a1a,#a33030)',
  'linear-gradient(135deg,#4a1a6b,#7a30a3)',
];
const EMOJIS_CAT = ['☕','🍵','🧋','🍊','🫖','✨'];

let menuCompleto = []; // todas las bebidas aplanadas

// ── Cargar carrito ────────────────────────────────────────
function actualizarCarrito() {
  const carrito = JSON.parse(sessionStorage.getItem('carrito') || '[]');
  const total = carrito.reduce((s, i) => s + i.cantidad, 0);
  document.getElementById('cartCount').textContent = total;
}
actualizarCarrito();

// ── Cargar categorías y menú ──────────────────────────────
async function cargarMenu() {
  try {
    const r = await fetch(`${API}/customer/menu/full`);
    if (!r.ok) throw new Error(r.statusText);
    const categorias = await r.json();

    // Aplanar bebidas para búsqueda
    categorias.forEach(cat => {
      (cat.bebidas || []).forEach(b => {
        b._cat_id = cat.id;
        b._cat_nombre = cat.nombre;
        menuCompleto.push(b);
      });
    });

    renderCategorias(categorias);
    renderPopulares();
    actualizarSaludo();
  } catch(err) {
    document.getElementById('catGrid').innerHTML =
      `<div style="grid-column:1/-1;text-align:center;color:var(--latte);padding:40px">Error cargando menú: ${err.message}</div>`;
  }
}

function renderCategorias(categorias) {
  const grid = document.getElementById('catGrid');
  if (!categorias.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--latte);padding:40px">Sin categorías disponibles</div>';
    return;
  }
  grid.innerHTML = categorias.map((cat, i) => {
    const grad  = GRADIENTES[i % GRADIENTES.length];
    const emoji = EMOJIS_CAT[i % EMOJIS_CAT.length];
    const count = (cat.bebidas || []).length;
    // Imagen: primera bebida de la categoría que tenga imagen
    const imgBebida = (cat.bebidas || []).find(b => b.imagen_url);
    const bgContent = imgBebida
      ? `<img src="${imgBebida.imagen_url}" alt="${cat.nombre}" onerror="this.parentElement.style.background='${grad}';this.remove()">
         <div class="fallback-emoji" style="display:none">${emoji}</div>`
      : `<div class="fallback-emoji">${emoji}</div>`;

    return `<div class="cat-card" onclick="irCategoria(${cat.id}, '${cat.nombre.replace(/'/g,"\\'")}')">
      <div class="cat-bg" style="background:${grad}">${bgContent}</div>
      <div class="cat-overlay">
        <div class="cat-name">${cat.nombre}</div>
        <div class="cat-count">${count} bebida${count !== 1 ? 's' : ''}</div>
      </div>
    </div>`;
  }).join('');
}

function renderPopulares() {
  // Mostrar las primeras 5 bebidas como populares
  const populares = menuCompleto.slice(0, 5);
  if (!populares.length) return;

  document.getElementById('labelPopulares').style.display = 'block';
  document.getElementById('popularRow').innerHTML =
    `<div class="pop-chip gold">🔥 Más pedido</div>` +
    populares.map(b => {
      const img = b.imagen_url
        ? `<img src="${b.imagen_url}" alt="${b.nombre}" style="width:20px;height:20px;border-radius:50%;object-fit:cover" onerror="this.remove()">`
        : '☕';
      return `<div class="pop-chip" onclick="irDetalle(${b.id})">${img} ${b.nombre}</div>`;
    }).join('');
}

function actualizarSaludo() {
  const hora = new Date().getHours();
  const el = document.getElementById('saludoContexto');
  if (hora < 11) el.textContent = '☀️ Buenos días — perfecta para una bebida caliente';
  else if (hora < 15) el.textContent = '☀️ La hora perfecta para un frapé bien frío';
  else el.textContent = '🌙 Buenas tardes — ¿un latte relajante?';
}

// ── Navegación ────────────────────────────────────────────
function irCategoria(catId, catNombre) {
  sessionStorage.setItem('categoria_id', catId);
  sessionStorage.setItem('categoria_nombre', catNombre);
  window.location.href = 's3-detalle.html';
}

function irDetalle(bebidaId) {
  sessionStorage.setItem('bebida_id', bebidaId);
  window.location.href = 's3-detalle.html';
}

// ── Búsqueda ──────────────────────────────────────────────
document.getElementById('busqueda').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  const grid    = document.getElementById('catGrid');
  const results = document.getElementById('searchResults');
  const popRow  = document.getElementById('popularRow');
  const popLbl  = document.getElementById('labelPopulares');

  if (!q) {
    grid.style.display = '';
    results.style.display = 'none';
    popRow.style.display = '';
    popLbl.style.display = menuCompleto.length ? '' : 'none';
    return;
  }

  const filtradas = menuCompleto.filter(b =>
    b.nombre.toLowerCase().includes(q) ||
    (b.descripcion || '').toLowerCase().includes(q)
  );

  grid.style.display = 'none';
  popRow.style.display = 'none';
  popLbl.style.display = 'none';
  results.style.display = 'flex';

  if (!filtradas.length) {
    results.innerHTML = `<div style="text-align:center;color:var(--latte);padding:30px">Sin resultados para "${q}"</div>`;
    return;
  }

  results.innerHTML = filtradas.map(b => {
    const img = b.imagen_url
      ? `<img src="${b.imagen_url}" alt="${b.nombre}" onerror="this.parentElement.innerHTML='☕'">`
      : '☕';
    return `<div class="sr-item" onclick="irDetalle(${b.id})">
      <div class="sr-img">${img}</div>
      <div style="flex:1">
        <div class="sr-name">${b.nombre}</div>
        <div style="font-size:11px;color:var(--latte)">${b._cat_nombre}</div>
      </div>
      <div class="sr-price">$${b.precio_chico || 0}</div>
    </div>`;
  }).join('');
});

cargarMenu();
</script>
</body>
</html>
