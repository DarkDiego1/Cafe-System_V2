<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosco — S7 Confirmación</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDD8;--warm:#EAD7B0;--espresso:#2C1A0E;--roast:#4A2C1A;--caramel:#C47F2B;--gold:#E8A830;--latte:#8B5E3C;--foam:#FBF5E6;--mist:#F0E6CF;--success:#3A7D44;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--espresso);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
.shell{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:24px;}
.confirm-check{margin-top:52px;width:96px;height:96px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;animation:pop .4s cubic-bezier(.175,.885,.32,1.275);margin-bottom:20px;}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.confirm-num{font-family:'Playfair Display',serif;font-size:46px;font-weight:700;color:var(--gold);margin-bottom:4px;}
.confirm-label{font-size:14px;color:var(--warm);margin-bottom:28px;}
.confirm-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px 20px;margin:0 20px;text-align:left;width:calc(100% - 40px);}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--warm);margin-bottom:8px;}
.row span:last-child{color:var(--cream);font-weight:500;}
.row.big{font-size:15px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;margin-top:4px;}
.row.big span:last-child{color:var(--gold);font-weight:600;}
.codigo-block{margin:18px 20px 0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;width:calc(100% - 40px);}
.cod-icon{width:60px;height:60px;background:var(--cream);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.cod-info h4{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;color:var(--cream);text-align:left;}
.cod-info p{font-size:11px;color:var(--warm);margin-top:3px;text-align:left;}
.confirm-actions{padding:20px 20px 0;display:flex;gap:10px;width:100%;}
.btn-ghost{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:var(--cream);border-radius:14px;padding:13px;font-size:13px;cursor:pointer;font-family:inherit;}
.btn-gold{flex:1;background:var(--gold);color:var(--espresso);border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div class="shell">
  <div class="confirm-check">✓</div>
  <div class="confirm-num" id="ordenNumero">#—</div>
  <div class="confirm-label">¡Tu orden está confirmada!</div>

  <div class="confirm-card" id="itemsList"></div>

  <div class="codigo-block">
    <div class="cod-icon">📋</div>
    <div class="cod-info">
      <h4 id="codigoOrden">Código: —</h4>
      <p>Muestra este código al recoger tu pedido</p>
      <p style="margin-top:4px;font-size:10px;color:#d4b88a">Tiempo estimado: ~8–12 min</p>
    </div>
  </div>

  <div class="confirm-actions">
    <button class="btn-ghost" onclick="nuevaOrden()">Nueva orden</button>
    <button class="btn-gold" onclick="verEstado()">Ver estado →</button>
  </div>
</div>
<script>
const ordenId    = sessionStorage.getItem('orden_id') || '—';
const codigo     = sessionStorage.getItem('codigo_orden') || ordenId.slice(0,8).toUpperCase();
const carrito    = JSON.parse(sessionStorage.getItem('carrito') || '[]');
const subtotal   = sessionStorage.getItem('subtotal') || '0';
const propina    = sessionStorage.getItem('propina') || '0';
const total      = sessionStorage.getItem('total_final') || subtotal;

document.getElementById('ordenNumero').textContent = `#${codigo}`;
document.getElementById('codigoOrden').textContent = `Código: ${codigo}`;

const itemsHtml = carrito.map(i =>
  `<div class="row"><span>${i.nombre} ${i.tamano} ×${i.cantidad}</span><span>$${i.precio_final * i.cantidad}</span></div>`
).join('');

document.getElementById('itemsList').innerHTML = itemsHtml +
  `<div class="row"><span>Propina</span><span>$${propina}</span></div>
   <div class="row big"><span>Total pagado</span><span>$${total}</span></div>`;

// Limpiar carrito
sessionStorage.removeItem('carrito');
sessionStorage.removeItem('subtotal');
sessionStorage.removeItem('propina');

function nuevaOrden() {
  sessionStorage.clear();
  window.location.href = 's1-bienvenida.html';
}

function verEstado() {
  window.location.href = `s8-espera.html`;
}

// Auto-redirigir a espera después de 8 segundos
setTimeout(() => window.location.href = 's8-espera.html', 8000);
</script>
</body>
</html>
