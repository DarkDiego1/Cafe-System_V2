<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerente — G6 Reportes de Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDD8;--warm:#EAD7B0;--espresso:#2C1A0E;--roast:#4A2C1A;--caramel:#C47F2B;--gold:#E8A830;--latte:#8B5E3C;--foam:#FBF5E6;--mist:#F0E6CF;--success:#3A7D44;--danger:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--espresso);min-height:100vh;display:flex;flex-direction:column;}
.shell{background:var(--cream);width:100%;min-height:100vh;display:flex;flex-direction:column;flex:1;}
.page-top{background:var(--espresso);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.page-top h2{font-family:'Playfair Display',serif;color:var(--cream);font-size:22px;}
.page-top p{color:var(--warm);font-size:12px;margin-top:2px;}
.page-top .actions{display:flex;gap:8px;align-items:center;}
.btn-p{background:var(--espresso);color:var(--cream);border:none;border-radius:10px;padding:9px 18px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;}
.btn-p:hover{background:var(--roast);}
.btn-p.gold{background:var(--gold);color:var(--espresso);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px;}
.kpi{background:var(--foam);border:1px solid var(--warm);border-radius:16px;padding:16px;}
.kpi .kv{font-family:'Playfair Display',serif;font-size:26px;color:var(--espresso);margin-bottom:2px;}
.kpi .kl{font-size:11px;color:var(--latte);}
.kpi .kd{font-size:12px;margin-top:4px;font-weight:600;}
.kpi .kd.up{color:var(--success);}
.kpi .kd.neu{color:var(--caramel);}
.section-label{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--latte);margin-bottom:10px;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:11px;color:var(--latte);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:8px 12px;background:var(--mist);text-align:left;}
tbody td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--warm);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--mist);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--espresso);color:var(--cream);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="shell">
  <div class="page-top">
    <div><h2>Reportes de Ventas</h2><p>UC60–62 · RF24/RF62/RF64</p></div>
    <div class="actions">
      <input type="date" id="fechaDesde" style="border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--cream);border-radius:10px;padding:6px 10px;font-family:inherit;font-size:12px">
      <input type="date" id="fechaHasta" style="border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--cream);border-radius:10px;padding:6px 10px;font-family:inherit;font-size:12px">
      <button class="btn-p" id="btnAplicar" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25)">Aplicar</button>
      <button class="btn-p gold" id="btnExportar">↓ Exportar</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kv" id="kpiVentas">—</div><div class="kl">Ventas del período</div><div class="kd up" id="kpiVentasDelta">Cargando…</div></div>
    <div class="kpi"><div class="kv" id="kpiOrdenes">—</div><div class="kl">Total órdenes</div><div class="kd up" id="kpiOrdenesDelta"></div></div>
    <div class="kpi"><div class="kv" id="kpiTicket">—</div><div class="kl">Ticket promedio</div><div class="kd neu">Período</div></div>
    <div class="kpi"><div class="kv" id="kpiSatisfaccion">—%</div><div class="kl">Órdenes a tiempo</div><div class="kd up" id="kpiSatDelta"></div></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 20px 24px">
    <div>
      <p class="section-label">Top bebidas del período</p>
      <table id="tablaTopBebidas">
        <thead><tr><th>#</th><th>Bebida</th><th>Unidades</th><th>Ingreso</th></tr></thead>
        <tbody id="tbodyBebidas">
          <tr><td colspan="4" style="text-align:center;color:var(--latte);padding:20px">Selecciona un período y aplica</td></tr>
        </tbody>
      </table>
    </div>
    <div>
      <p class="section-label">Eficiencia por empleado</p>
      <table id="tablaEmpleados">
        <thead><tr><th>Empleado</th><th>Órdenes</th><th>Tiempo prom.</th><th>A tiempo</th></tr></thead>
        <tbody id="tbodyEmpleados">
          <tr><td colspan="4" style="text-align:center;color:var(--latte);padding:20px">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8000/api';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function formatMoney(n) {
  return '$' + Number(n||0).toLocaleString('es-MX', {minimumFractionDigits:0,maximumFractionDigits:0});
}

async function cargarReporte() {
  const desde = document.getElementById('fechaDesde').value;
  const hasta = document.getElementById('fechaHasta').value;
  if (!desde || !hasta) { showToast('⚠ Selecciona un rango de fechas'); return; }

  const fi = desde + 'T00:00:00';
  const ff = hasta + 'T23:59:59';

  try {
    // KPIs de ventas
    const rVentas = await fetch(`${API}/reports/sales?fecha_inicio=${fi}&fecha_fin=${ff}`);
    if (rVentas.ok) {
      const v = await rVentas.json();
      document.getElementById('kpiVentas').textContent  = formatMoney(v.total_ventas);
      document.getElementById('kpiOrdenes').textContent = v.total_ordenes || 0;
      document.getElementById('kpiTicket').textContent  = formatMoney(v.ticket_promedio);
    }

    // Bebidas populares
    const rBebidas = await fetch(`${API}/reports/drinks/popular?fecha_inicio=${fi}&fecha_fin=${ff}&top=5`);
    if (rBebidas.ok) {
      const bebidas = await rBebidas.json();
      const lista = bebidas.bebidas_populares || bebidas || [];
      document.getElementById('tbodyBebidas').innerHTML = lista.length
        ? lista.map((b,i) => `<tr>
            <td>${i+1}</td>
            <td>${b.nombre}</td>
            <td>${b.total_vendido || b.cantidad || 0}</td>
            <td>${formatMoney(b.ingreso_total || b.ingresos || 0)}</td>
          </tr>`).join('')
        : '<tr><td colspan="4" style="text-align:center;color:var(--latte);padding:16px">Sin datos</td></tr>';
    }

    // Eficiencia
    const rEfic = await fetch(`${API}/reports/orders/efficiency?fecha_inicio=${fi}&fecha_fin=${ff}`);
    if (rEfic.ok) {
      const e = await rEfic.json();
      document.getElementById('kpiSatisfaccion').textContent = `${e.pct_a_tiempo || 0}%`;

      const empleados = e.por_empleado || [];
      document.getElementById('tbodyEmpleados').innerHTML = empleados.length
        ? empleados.map(emp => `<tr>
            <td>${emp.empleado || emp.nombre || '—'}</td>
            <td>${emp.total_ordenes || 0}</td>
            <td>${emp.tiempo_promedio_min || 0} min</td>
            <td>${emp.pct_a_tiempo || 0}%</td>
          </tr>`).join('')
        : '<tr><td colspan="4" style="text-align:center;color:var(--latte);padding:16px">Sin datos de empleados</td></tr>';
    }
  } catch(err) {
    showToast('❌ Error al cargar reportes: ' + err.message);
  }
}

// Fechas por defecto: primer día del mes hasta hoy
const hoy = new Date();
const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().split('T')[0];
document.getElementById('fechaDesde').value = primerDia;
document.getElementById('fechaHasta').value = hoy.toISOString().split('T')[0];

document.getElementById('btnAplicar').addEventListener('click', cargarReporte);

document.getElementById('btnExportar').addEventListener('click', async () => {
  const desde = document.getElementById('fechaDesde').value;
  const hasta = document.getElementById('fechaHasta').value;
  showToast('📊 Generando exportación…');
  try {
    const r = await fetch(`${API}/reports/sales?fecha_inicio=${desde}T00:00:00&fecha_fin=${hasta}T23:59:59`);
    const data = await r.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `reporte_${desde}_${hasta}.json`;
    a.click();
    showToast('✅ Exportado');
  } catch(err) {
    showToast('❌ Error: ' + err.message);
  }
});

// Cargar al iniciar
cargarReporte();
</script>
</body>
</html>
