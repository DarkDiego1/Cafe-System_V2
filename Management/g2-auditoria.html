<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerente — G2 Auditoría</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDD8;--warm:#EAD7B0;--espresso:#2C1A0E;--roast:#4A2C1A;--caramel:#C47F2B;--gold:#E8A830;--latte:#8B5E3C;--foam:#FBF5E6;--mist:#F0E6CF;--success:#3A7D44;--danger:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--espresso);min-height:100vh;display:flex;flex-direction:column;}
.shell{background:var(--cream);width:100%;min-height:100vh;display:flex;flex-direction:column;flex:1;}
.page-top{background:var(--espresso);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.page-top h2{font-family:'Playfair Display',serif;color:var(--cream);font-size:22px;}
.page-top p{color:var(--warm);font-size:12px;margin-top:2px;}
.page-top .actions{display:flex;gap:8px;}
.btn-p{background:var(--espresso);color:var(--cream);border:none;border-radius:10px;padding:9px 18px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;}
.btn-p:hover{background:var(--roast);}
.btn-ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--cream);border-radius:10px;padding:9px 16px;font-size:12px;cursor:pointer;font-family:inherit;}
.input{width:100%;border:1.5px solid var(--warm);border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;background:var(--mist);outline:none;color:var(--espresso);}
.select{width:100%;border:1.5px solid var(--warm);border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;background:var(--mist);outline:none;color:var(--espresso);appearance:none;}
.field label{display:block;font-size:11px;color:var(--latte);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:11px;color:var(--latte);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:8px 12px;background:var(--mist);text-align:left;}
tbody td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--warm);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--mist);}
.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:10px;font-weight:700;}
.b-ok{background:#e8f5eb;color:var(--success);}
.b-warn{background:#fdf4e3;color:var(--caramel);}
.b-err{background:#fce8e6;color:var(--danger);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--espresso);color:var(--cream);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="shell">
  <div class="page-top">
    <div><h2>Auditoría del Sistema</h2><p>Log de actividad · UC65</p></div>
    <div class="actions">
      <button class="btn-ghost" id="btnPDF">↓ PDF</button>
      <button class="btn-ghost" id="btnExcel">↓ Excel</button>
    </div>
  </div>

  <div style="padding:20px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div class="field">
        <label>Tipo de evento</label>
        <select class="select" id="filtroTipo">
          <option value="">Todos los eventos</option>
          <option value="crear_orden">Órdenes creadas</option>
          <option value="cambiar_estado_orden">Cambios de estado</option>
          <option value="modificar_menu">Cambios de menú</option>
          <option value="crear_empleado">Empleados</option>
          <option value="ajuste_stock_manual">Ajustes de inventario</option>
          <option value="configurar_umbrales">Configuración</option>
          <option value="login">Accesos</option>
        </select>
      </div>
      <div class="field">
        <label>Usuario (ID)</label>
        <input class="input" id="filtroUsuario" placeholder="ID numérico del usuario">
      </div>
      <div class="field">
        <label>Desde</label>
        <input class="input" type="date" id="filtroDesde">
      </div>
      <div class="field">
        <label>Hasta</label>
        <input class="input" type="date" id="filtroHasta">
      </div>
    </div>
    <button class="btn-p" id="btnFiltrar" style="margin-bottom:16px">Filtrar</button>
    <span id="totalRegistros" style="font-size:12px;color:var(--latte);margin-left:12px"></span>

    <table id="tablaAuditoria">
      <thead>
        <tr><th>Fecha/Hora</th><th>Evento</th><th>Descripción</th><th>Usuario</th><th>IP</th><th>Entidad</th></tr>
      </thead>
      <tbody id="tbodyAuditoria">
        <tr><td colspan="6" style="text-align:center;color:var(--latte);padding:20px">Cargando registros…</td></tr>
      </tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8000/api';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function formatFecha(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', {day:'2-digit',month:'short'})
    + ' ' + d.toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'});
}

function badgeEvento(tipo) {
  if (!tipo) return '<span class="badge b-warn">—</span>';
  if (tipo.includes('crear') || tipo.includes('login')) return `<span class="badge b-ok">${tipo}</span>`;
  if (tipo.includes('error') || tipo.includes('eliminar')) return `<span class="badge b-err">${tipo}</span>`;
  return `<span class="badge b-warn">${tipo}</span>`;
}

async function cargarAuditoria(params = {}) {
  const qs = new URLSearchParams();
  if (params.tipo_evento) qs.set('tipo_evento', params.tipo_evento);
  if (params.usuario_id)  qs.set('usuario_id', params.usuario_id);
  if (params.fecha_inicio) qs.set('fecha_inicio', params.fecha_inicio + 'T00:00:00');
  if (params.fecha_fin)    qs.set('fecha_fin',    params.fecha_fin   + 'T23:59:59');
  qs.set('limit', '100');

  try {
    const r = await fetch(`${API}/admin/audit?${qs}`);
    if (!r.ok) throw new Error(r.statusText);
    const data = await r.json();
    const registros = data.registros || [];

    document.getElementById('totalRegistros').textContent =
      `${data.total || registros.length} registros encontrados`;

    const tbody = document.getElementById('tbodyAuditoria');
    if (!registros.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--latte);padding:20px">Sin registros para los filtros seleccionados</td></tr>';
      return;
    }

    tbody.innerHTML = registros.map(reg => `
      <tr>
        <td>${formatFecha(reg.fecha)}</td>
        <td>${badgeEvento(reg.tipo_evento)}</td>
        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
            title="${reg.descripcion || ''}">${reg.descripcion || '—'}</td>
        <td>${reg.nombre_usuario || '—'}</td>
        <td style="font-size:11px;color:var(--latte)">${reg.ip_origen || '—'}</td>
        <td style="font-size:11px;color:var(--latte)">${reg.entidad_afectada || '—'}</td>
      </tr>`).join('');
  } catch(err) {
    document.getElementById('tbodyAuditoria').innerHTML =
      `<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:20px">
        Error al cargar: ${err.message}
      </td></tr>`;
  }
}

// Valores por defecto de fechas
const hoy = new Date().toISOString().split('T')[0];
const hace7dias = new Date(Date.now() - 7*24*60*60*1000).toISOString().split('T')[0];
document.getElementById('filtroDesde').value = hace7dias;
document.getElementById('filtroHasta').value = hoy;

document.getElementById('btnFiltrar').addEventListener('click', () => {
  cargarAuditoria({
    tipo_evento:   document.getElementById('filtroTipo').value,
    usuario_id:    document.getElementById('filtroUsuario').value,
    fecha_inicio:  document.getElementById('filtroDesde').value,
    fecha_fin:     document.getElementById('filtroHasta').value,
  });
});

document.getElementById('btnPDF').addEventListener('click', async () => {
  showToast('📄 Exportando a PDF…');
  // Exportar la tabla como texto plano (PDF real requiere librería adicional)
  const filas = [...document.querySelectorAll('#tbodyAuditoria tr')];
  const texto = filas.map(tr =>
    [...tr.querySelectorAll('td')].map(td => td.textContent.trim()).join(' | ')
  ).join('\n');
  const blob = new Blob([texto], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `auditoria_${hoy}.txt`;
  a.click();
  showToast('✅ Exportado');
});

document.getElementById('btnExcel').addEventListener('click', async () => {
  showToast('📊 Exportando a CSV…');
  const qs = new URLSearchParams({limit:'500'});
  try {
    const r = await fetch(`${API}/admin/audit?${qs}`);
    const data = await r.json();
    const registros = data.registros || [];
    const csv = ['Fecha,Evento,Descripcion,Usuario,IP,Entidad',
      ...registros.map(reg =>
        [formatFecha(reg.fecha), reg.tipo_evento, reg.descripcion,
         reg.nombre_usuario, reg.ip_origen, reg.entidad_afectada]
        .map(v => `"${(v||'').replace(/"/g,'""')}"`)
        .join(',')
      )
    ].join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `auditoria_${hoy}.csv`;
    a.click();
    showToast('✅ CSV descargado');
  } catch(err) {
    showToast('❌ Error: ' + err.message);
  }
});

// Carga inicial
cargarAuditoria({ fecha_inicio: hace7dias, fecha_fin: hoy });
</script>
</body>
</html>
