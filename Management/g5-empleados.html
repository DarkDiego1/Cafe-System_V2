<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerente — G5 Gestión de Empleados</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDD8;--warm:#EAD7B0;--espresso:#2C1A0E;--roast:#4A2C1A;--caramel:#C47F2B;--gold:#E8A830;--latte:#8B5E3C;--foam:#FBF5E6;--mist:#F0E6CF;--success:#3A7D44;--danger:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--espresso);min-height:100vh;display:flex;flex-direction:column;}
.shell{background:var(--cream);width:100%;min-height:100vh;display:flex;flex-direction:column;flex:1;}
.page-top{background:var(--espresso);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.page-top h2{font-family:'Playfair Display',serif;color:var(--cream);font-size:22px;}
.page-top p{color:var(--warm);font-size:12px;margin-top:2px;}
.btn-p{background:var(--espresso);color:var(--cream);border:none;border-radius:10px;padding:9px 18px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;}
.btn-p:hover{background:var(--roast);}
.btn-p.gold{background:var(--gold);color:var(--espresso);}
.input{width:100%;border:1.5px solid var(--warm);border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;background:var(--mist);outline:none;color:var(--espresso);}
.select{width:100%;border:1.5px solid var(--warm);border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;background:var(--mist);outline:none;color:var(--espresso);appearance:none;}
.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:10px;font-weight:700;}
.b-ok{background:#e8f5eb;color:var(--success);}
.b-gray{background:var(--mist);color:var(--latte);}
.split{display:grid;grid-template-columns:1fr 280px;min-height:500px;}
.left-p{padding:20px;}
.right-p{padding:20px;background:var(--foam);border-left:1px solid var(--warm);}
.emp-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--foam);border:1.5px solid var(--warm);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.emp-card.act{border-color:var(--caramel);background:#fdf4e3;}
.emp-av{width:36px;height:36px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.emp-det{flex:1;}
.emp-name{font-size:13px;font-weight:600;}
.emp-role{font-size:11px;color:var(--latte);}
.perm-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--warm);}
.perm-item:last-child{border-bottom:none;}
.perm-item p{font-size:13px;}
.perm-item small{font-size:11px;color:var(--latte);}
.toggle{display:flex;align-items:center;gap:8px;}
.tg{width:36px;height:20px;background:var(--success);border-radius:10px;position:relative;cursor:pointer;flex-shrink:0;}
.tg .tk{width:14px;height:14px;background:#fff;border-radius:50%;position:absolute;right:3px;top:3px;transition:all .2s;}
.tg.off{background:var(--warm);}
.tg.off .tk{right:auto;left:3px;}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--foam);border-radius:16px;padding:24px;width:380px;max-width:95vw;}
.modal h3{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--latte);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.modal-footer{display:flex;gap:8px;margin-top:16px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--espresso);color:var(--cream);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="shell">
  <div class="page-top">
    <div><h2>Gestión de Empleados</h2><p>UC58–59 · RF61 permisos</p></div>
    <button class="btn-p gold" id="btnNuevoEmp">+ Nuevo empleado</button>
  </div>

  <div class="split">
    <div class="left-p">
      <input class="input" id="buscarEmp" placeholder="🔍 Buscar empleado…" style="margin-bottom:12px">
      <div id="listaEmpleados">
        <p style="color:var(--latte);font-size:13px;padding:20px 0">Cargando empleados…</p>
      </div>
    </div>

    <div class="right-p">
      <p style="font-family:'Playfair Display',serif;font-size:16px;font-weight:600;margin-bottom:16px" id="permTitulo">Selecciona un empleado</p>

      <div id="panelPermisos" style="opacity:.4;pointer-events:none">
        <div style="margin-bottom:12px">
          <label style="font-size:11px;color:var(--latte);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px">Rol</label>
          <select class="select" id="selectRol">
            <option value="empleado">Empleado</option>
            <option value="barista">Barista</option>
            <option value="gerente">Gerente</option>
          </select>
        </div>

        <p style="font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--latte);margin-bottom:10px">Permisos del rol</p>
        <div id="listaPermisos" style="font-size:12px;color:var(--latte);padding:8px 0">
          Selecciona un empleado para ver sus permisos
        </div>

        <div style="height:14px"></div>
        <button class="btn-p" id="btnGuardarPermisos" style="width:100%">Guardar rol</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal nuevo empleado -->
<div class="modal-overlay" id="modalEmp">
  <div class="modal">
    <h3>Nuevo empleado</h3>
    <div class="field"><label>Nombre completo</label><input class="input" id="empNombre" placeholder="Nombre y apellido"></div>
    <div class="field"><label>Usuario (login)</label><input class="input" id="empUsuario" placeholder="usuario_unico"></div>
    <div class="field"><label>Contraseña</label><input class="input" type="password" id="empPassword" placeholder="Mínimo 6 caracteres"></div>
    <div class="field"><label>Rol</label>
      <select class="select" id="empRol">
        <option value="empleado">Empleado</option>
        <option value="barista">Barista</option>
        <option value="gerente">Gerente</option>
      </select>
    </div>
    <div class="field"><label>Email</label><input class="input" id="empEmail" placeholder="correo@ejemplo.com"></div>
    <div class="modal-footer">
      <button class="btn-p" id="btnGuardarEmp" style="flex:1">Crear empleado</button>
      <button class="btn-p" id="btnCancelarEmp" style="background:var(--warm);color:var(--espresso);flex:1">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8000/api';
let empSeleccionado = null;
const rolesIconos = { gerente:'👔', barista:'☕', empleado:'🍽️' };

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Cargar empleados ──────────────────────────────────────

async function cargarEmpleados() {
  try {
    const r = await fetch(`${API}/admin/employees`);
    if (!r.ok) throw new Error(r.statusText);
    const empleados = await r.json();
    renderEmpleados(empleados);
  } catch(err) {
    document.getElementById('listaEmpleados').innerHTML =
      `<p style="color:var(--danger);font-size:13px">Error: ${err.message}</p>`;
  }
}

function renderEmpleados(empleados) {
  const q = document.getElementById('buscarEmp').value.toLowerCase();
  const filtrados = empleados.filter(e =>
    !q || e.nombre_completo.toLowerCase().includes(q)
  );

  if (!filtrados.length) {
    document.getElementById('listaEmpleados').innerHTML =
      '<p style="color:var(--latte);font-size:13px;padding:20px 0">Sin empleados encontrados</p>';
    return;
  }

  document.getElementById('listaEmpleados').innerHTML = filtrados.map(e => {
    const icono = rolesIconos[e.rol] || '👤';
    const badge = e.activo
      ? '<span class="badge b-ok">Activo</span>'
      : '<span class="badge b-gray">Inactivo</span>';
    const activo = empSeleccionado?.id === e.id ? 'act' : '';
    return `<div class="emp-card ${activo}" data-id="${e.id}" onclick="seleccionarEmp(${e.id})">
      <div class="emp-av">${icono}</div>
      <div class="emp-det">
        <div class="emp-name">${e.nombre_completo}</div>
        <div class="emp-role">${e.rol} · ${e.usuario || ''}</div>
      </div>
      ${badge}
    </div>`;
  }).join('');
}

// ── Seleccionar empleado ──────────────────────────────────

async function seleccionarEmp(id) {
  try {
    const r = await fetch(`${API}/admin/employees/${id}`);
    if (!r.ok) throw new Error(r.statusText);
    empSeleccionado = await r.json();

    document.getElementById('permTitulo').textContent =
      `${empSeleccionado.nombre_completo} — Rol y permisos`;
    document.getElementById('selectRol').value = empSeleccionado.rol || 'empleado';

    // Mostrar permisos del rol
    const permisos = empSeleccionado.permisos || [];
    document.getElementById('listaPermisos').innerHTML = permisos.length
      ? permisos.map(p => `<div style="padding:4px 0">✓ ${p.replace(/_/g,' ')}</div>`).join('')
      : '<div style="color:var(--latte)">Sin permisos asignados</div>';

    // Habilitar panel
    document.getElementById('panelPermisos').style.opacity = '1';
    document.getElementById('panelPermisos').style.pointerEvents = 'auto';

    // Resaltar card
    document.querySelectorAll('.emp-card').forEach(c => c.classList.remove('act'));
    document.querySelector(`.emp-card[data-id="${id}"]`)?.classList.add('act');
  } catch(err) {
    showToast('❌ Error al cargar empleado: ' + err.message);
  }
}

// ── Guardar rol ───────────────────────────────────────────

document.getElementById('btnGuardarPermisos').addEventListener('click', async () => {
  if (!empSeleccionado) return;
  const nuevoRol = document.getElementById('selectRol').value;

  try {
    const r = await fetch(`${API}/admin/employees/${empSeleccionado.id}/role`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({rol: nuevoRol}),
    });
    if (r.ok) {
      const data = await r.json();
      showToast(`✅ Rol actualizado a "${nuevoRol}"`);
      // Refrescar permisos
      const permisos = data.empleado?.permisos || [];
      document.getElementById('listaPermisos').innerHTML = permisos.length
        ? permisos.map(p => `<div style="padding:4px 0">✓ ${p.replace(/_/g,' ')}</div>`).join('')
        : '<div>Sin permisos</div>';
      cargarEmpleados();
    } else {
      const err = await r.json();
      showToast('❌ ' + (err.detail || 'Error al guardar'));
    }
  } catch(err) {
    showToast('❌ Error: ' + err.message);
  }
});

// ── Nuevo empleado ────────────────────────────────────────

document.getElementById('btnNuevoEmp').addEventListener('click', () => {
  document.getElementById('modalEmp').classList.add('open');
});

document.getElementById('btnCancelarEmp').addEventListener('click', () => {
  document.getElementById('modalEmp').classList.remove('open');
});

document.getElementById('btnGuardarEmp').addEventListener('click', async () => {
  const nombre   = document.getElementById('empNombre').value.trim();
  const usuario  = document.getElementById('empUsuario').value.trim();
  const password = document.getElementById('empPassword').value;
  const rol      = document.getElementById('empRol').value;
  const email    = document.getElementById('empEmail').value.trim();

  if (!nombre || !usuario || password.length < 6) {
    showToast('⚠ Nombre, usuario y contraseña (mín. 6 chars) son obligatorios');
    return;
  }

  try {
    // Hashear la contraseña en el cliente es opcional — aquí se envía al backend
    // que la hashea internamente
    const r = await fetch(`${API}/admin/employees`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        nombre_completo: nombre,
        usuario,
        contrasena_hash: password, // el backend hashea
        rol,
        email: email || null,
      }),
    });
    if (r.ok) {
      showToast('✅ Empleado creado correctamente');
      document.getElementById('modalEmp').classList.remove('open');
      cargarEmpleados();
    } else {
      const err = await r.json();
      showToast('❌ ' + (err.detail || 'Error al crear'));
    }
  } catch(err) {
    showToast('❌ Error: ' + err.message);
  }
});

// ── Búsqueda ──────────────────────────────────────────────

let todosEmpleados = [];
document.getElementById('buscarEmp').addEventListener('input', () => {
  renderEmpleados(todosEmpleados);
});

// ── Init ──────────────────────────────────────────────────

async function init() {
  try {
    const r = await fetch(`${API}/admin/employees`);
    todosEmpleados = await r.json();
    renderEmpleados(todosEmpleados);
  } catch(err) {
    document.getElementById('listaEmpleados').innerHTML =
      `<p style="color:var(--danger);font-size:13px">Error al cargar: ${err.message}</p>`;
  }
}

init();
</script>
</body>
</html>
